name: Checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Verify committed frontend build
        run: |
          git diff --exit-code -- agent_home/static/build
          test -z "$(git ls-files --others --exclude-standard agent_home/static/build)"
      - run: python -m pip install uv
      - run: uv sync --locked
      - run: uv run python -m unittest -v
      - run: git diff --check
  macos-package:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install uv
      - run: uv sync --managed-python --python 3.13 --locked --group macos-build
      - run: uv run --managed-python --group macos-build python packaging/macos/build.py
      - name: Exercise the frozen server with disposable data
        run: |
          uv run python - <<'PY'
          from pathlib import Path
          import test_cli
          import test_sleeve_creation
          import unittest
          test_cli.SERVER = [str(Path('dist/Agent Home.app/Contents/MacOS/agent-home-server').resolve())]
          test_sleeve_creation.WORKER_EXECUTABLE = test_cli.SERVER[0]
          suite = unittest.TestSuite([
              unittest.defaultTestLoader.loadTestsFromModule(test_cli),
              unittest.defaultTestLoader.loadTestsFromTestCase(test_sleeve_creation.DetachedProcessTests),
          ])
          if not unittest.TextTestRunner(verbosity=2).run(suite).wasSuccessful():
              raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Agent-Home-macOS
          path: dist/*.dmg
