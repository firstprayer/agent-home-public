name: Checks

on:
  pull_request:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Verify committed frontend build
        run: |
          git diff --exit-code -- agent_home/static/build
          test -z "$(git ls-files --others --exclude-standard agent_home/static/build)"
      - run: python -m pip install uv
      - run: uv sync --locked
      - run: uv run python -m unittest -v
      - run: git diff --check
  macos-package:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install uv
      - run: uv sync --managed-python --python 3.13 --locked --group macos-build
      - run: uv run --managed-python --group macos-build python packaging/macos/build.py
      - name: Verify native executable architectures
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          lipo 'dist/Agent Home.app/Contents/MacOS/AgentHome' -verify_arch "$EXPECTED_ARCH"
          lipo 'dist/Agent Home.app/Contents/MacOS/agent-home-server' -verify_arch "$EXPECTED_ARCH"
      - name: Exercise the frozen server with disposable data
        run: |
          uv run python - <<'PY'
          from pathlib import Path
          import test_cli
          import test_sleeve_creation
          import unittest
          test_cli.SERVER = [str(Path('dist/Agent Home.app/Contents/MacOS/agent-home-server').resolve())]
          test_sleeve_creation.WORKER_EXECUTABLE = test_cli.SERVER[0]
          suite = unittest.TestSuite([
              unittest.defaultTestLoader.loadTestsFromModule(test_cli),
              unittest.defaultTestLoader.loadTestsFromTestCase(test_sleeve_creation.DetachedProcessTests),
          ])
          if not unittest.TextTestRunner(verbosity=2).run(suite).wasSuccessful():
              raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Agent-Home-macOS-${{ matrix.arch }}
          path: dist/*.dmg

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [checks, macos-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify the release version
        run: |
          python - <<'PYTHON'
          import os, pathlib, tomllib
          version = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']
          tag = os.environ['GITHUB_REF_NAME']
          if tag != 'v' + version:
              raise SystemExit('Release tag must match pyproject.toml')
          if not pathlib.Path('docs/releases', tag + '.md').is_file():
              raise SystemExit('Release notes are required')
          PYTHON
      - uses: actions/download-artifact@v4
        with:
          pattern: Agent-Home-macOS-*
          merge-multiple: true
          path: dist
      - name: Require both macOS downloads
        run: |
          test -f "dist/Agent-Home-${GITHUB_REF_NAME#v}-macOS-arm64.dmg"
          test -f "dist/Agent-Home-${GITHUB_REF_NAME#v}-macOS-x86_64.dmg"
      - name: Generate download checksums
        working-directory: dist
        run: sha256sum Agent-Home-*.dmg > SHA256SUMS
      - name: Publish the macOS preview
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.dmg dist/SHA256SUMS \
            --verify-tag --prerelease --title "Agent Home $GITHUB_REF_NAME — macOS preview" \
            --notes-file "docs/releases/$GITHUB_REF_NAME.md"
      - name: Publish the project website
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run pages.yml --ref master -f publish=true
